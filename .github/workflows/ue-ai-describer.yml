name: UE AI Plugin Describer (Daily)

# 在公有仓库 ue6pages 中运行，操作本仓库的 gh-pages 分支。
# 通过 Playwright 访问 Epic Developer Assistant 为插件/模块生成 AI 描述。
# 使用 matrix 并行策略切分为多个 job 加速处理。

on:
  # 定时任务已暂停；恢复时取消下面两行注释即可
  # schedule:
  #   - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of plugins to process per job (leave empty for no limit)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (do not modify files)'
        required: false
        default: 'false'

permissions:
  contents: write

# 与 generate-ue-docs.yml 共用同一个组，串行写 gh-pages。
# 注意：生成文档的定时任务可能要等正在运行的 describer 结束（最长约 4 小时）后才开始。
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  NUM_JOBS: 5

jobs:
  describe-plugins:
    name: AI Describer (batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout public repo (scripts)
        uses: actions/checkout@v5
        with:
          path: public-repo

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
          path: ghpages

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: public-repo/scripts/ue-ai-describer/package-lock.json

      - name: Install dependencies
        working-directory: public-repo/scripts/ue-ai-describer
        run: npm ci

      - name: Install Playwright browsers
        working-directory: public-repo/scripts/ue-ai-describer
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # 每次运行保存一份新缓存（key 含 run_id），恢复时只取同一 batch 的最新一份，
      # 避免不同 batch 的浏览器配置互相覆盖。
      - name: Cache Playwright user data
        uses: actions/cache@v5
        with:
          path: public-repo/scripts/ue-ai-describer/.playwright-user-data
          key: ${{ runner.os }}-playwright-userdata-${{ matrix.batch }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-playwright-userdata-${{ matrix.batch }}-

      - name: Compute batch parameters
        id: batch
        run: |
          COUNT="${{ github.event.inputs.count }}"
          STEP="$NUM_JOBS"
          OFFSET="${{ matrix.batch }}"

          echo "step=$STEP" >> $GITHUB_OUTPUT
          echo "offset=$OFFSET" >> $GITHUB_OUTPUT
          echo "Batch ${{ matrix.batch }}: step=$STEP, offset=$OFFSET"

          if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "limit=$COUNT" >> $GITHUB_OUTPUT
            echo "Limit per job: $COUNT"
          else
            echo "limit=" >> $GITHUB_OUTPUT
            echo "No limit — processing all assigned items"
          fi

          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=--dry-run" >> $GITHUB_OUTPUT
          else
            echo "dry_run=" >> $GITHUB_OUTPUT
          fi

      # 失败不会中断后续步骤：已完成的进度仍会被提交，最后由 "Report failure" 把 job 标红
      - name: Run AI describer
        id: describe
        working-directory: public-repo/scripts/ue-ai-describer
        run: |
          LIMIT_ARG=""
          if [ -n "${{ steps.batch.outputs.limit }}" ]; then
            LIMIT_ARG="--limit=${{ steps.batch.outputs.limit }}"
          fi
          xvfb-run -a node index.js \
            "$GITHUB_WORKSPACE/ghpages" \
            --step=${{ steps.batch.outputs.step }} \
            --offset=${{ steps.batch.outputs.offset }} \
            --max-runtime-minutes=220 \
            $LIMIT_ARG \
            ${{ steps.batch.outputs.dry_run }}
        env:
          UE_AI_STATE_FILE: ${{ github.workspace }}/ghpages/.ue-ai-describer-state.json
          CI: false

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots-batch-${{ matrix.batch }}
          path: public-repo/scripts/ue-ai-describer/debug-screenshots/
          if-no-files-found: ignore

      - name: Check for changes
        id: git-check
        if: ${{ !cancelled() && steps.describe.conclusion != 'skipped' && github.event.inputs.dry_run != 'true' }}
        working-directory: ghpages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected for batch ${{ matrix.batch }}"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected for batch ${{ matrix.batch }}:"
            git diff --cached --stat
          fi

      # 先提交本批次结果，再同步远端：此时工作区是干净的，rebase 才能正常进行。
      # 远端有新提交时 rebase；只有 state 文件冲突会被自动合并，其他冲突直接失败。
      - name: Commit and push changes
        if: ${{ !cancelled() && steps.git-check.outputs.has_changes == 'true' }}
        working-directory: ghpages
        run: |
          set -uo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -q -m "chore: update AI descriptions (batch ${{ matrix.batch }}, daily)" \
            -m "Automated update by UE AI Plugin Describer workflow. Generated from Epic Developer Assistant."

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin gh-pages
            if ! git rebase --quiet origin/gh-pages; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" != ".ue-ai-describer-state.json" ]; then
                echo "::error::Unexpected rebase conflicts: $conflicts"
                git rebase --abort || true
                exit 1
              fi
              git show "origin/gh-pages:.ue-ai-describer-state.json" > /tmp/state-upstream.json 2>/dev/null || echo '{}' > /tmp/state-upstream.json
              git show "REBASE_HEAD:.ue-ai-describer-state.json" > /tmp/state-ours.json 2>/dev/null || echo '{}' > /tmp/state-ours.json
              node -e "
                const fs = require('fs');
                const load = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { return {}; } };
                const up = load('/tmp/state-upstream.json');
                const mine = load('/tmp/state-ours.json');
                const processed = [...new Set([...(up.processed || []), ...(mine.processed || [])])];
                const done = new Set(processed);
                const byPath = new Map();
                for (const f of [...(up.failed || []), ...(mine.failed || [])]) {
                  if (done.has(f.path)) continue;
                  const prev = byPath.get(f.path);
                  if (!prev || (f.time || 0) >= (prev.time || 0)) byPath.set(f.path, f);
                }
                fs.writeFileSync('.ue-ai-describer-state.json', JSON.stringify({ processed, failed: [...byPath.values()] }, null, 2));
              "
              git add .ue-ai-describer-state.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; echo "::error::rebase --continue failed"; exit 1; }
            fi

            if git push --quiet origin HEAD:gh-pages; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

      - name: Report describer failure
        if: ${{ always() && steps.describe.outcome == 'failure' }}
        run: |
          echo "::error::AI describer failed for batch ${{ matrix.batch }}. Progress made before the failure has been committed."
          exit 1
