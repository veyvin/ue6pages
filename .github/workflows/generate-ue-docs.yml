name: Generate & Deploy UE Docs

# 在公有仓库 ue6pages 中运行：
#   1. 从私有仓库 veyvin/UnrealEngine 拉取 UE 源码（sparse checkout）
#   2. 静态生成插件/模块目录（markdown + usage.fb 写入 gh-pages 分支）
#   3. 再调用 Deploy GitHub Pages，把 Vue 前端发到线上
#
# 线上站点是 Vue SPA，不是 Jekyll。gh-pages 只当数据分支。
# 《使用方法》等 AI 文档由本地后端批量生成，见 README 与 backend/usage_docs.py。

on:
  schedule:
    # 07:00 UTC every day (比私有仓库的 sync 晚 1 小时，确保同步完成后再生成文档)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Regenerate every doc even if it already exists'
        type: boolean
        default: false
      seed_from_private:
        description: 'Seed gh-pages from private repo (only needed on first run)'
        type: boolean
        default: false

permissions:
  contents: write   # push to gh-pages
  pages: write      # deploy-pages
  id-token: write   # deploy-pages OIDC

# 都会写 gh-pages 分支，串行执行避免推送冲突
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  TRANSLATE_ENABLED: ${{ vars.TRANSLATE_ENABLED || 'true' }}

jobs:
  generate-docs:
    name: Generate plugin / module docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (scripts)
        uses: actions/checkout@v5
        with:
          path: public-repo

      - name: Checkout private repo source (sparse)
        uses: actions/checkout@v5
        with:
          repository: veyvin/UnrealEngine
          ref: ue6-main
          fetch-depth: 1
          sparse-checkout: |
            Engine/Plugins
            Engine/Source
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: engine-repo

      - name: Checkout or init gh-pages
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            echo "gh-pages exists -> cloning"
            git clone --quiet --branch gh-pages --depth 1 "$REPO_URL" /tmp/ghpages
          else
            echo "gh-pages does not exist -> initialising"
            mkdir -p /tmp/ghpages
            cd /tmp/ghpages
            git init -q -b gh-pages
            git remote add origin "$REPO_URL"
          fi
          mkdir -p /tmp/ghpages/plugins /tmp/ghpages/modules

      - name: Seed from private repo gh-pages (optional)
        if: github.event.inputs.seed_from_private == 'true'
        run: |
          set -euo pipefail
          PRIVATE_URL="https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/veyvin/UnrealEngine.git"
          echo "Cloning private repo gh-pages as seed..."
          git clone --quiet --branch gh-pages --depth 1 "$PRIVATE_URL" /tmp/private-ghpages || {
            echo "Private repo gh-pages not found, skipping seed."
            exit 0
          }
          # Copy everything except .git into our gh-pages worktree
          rsync -a --delete --exclude='.git' /tmp/private-ghpages/ /tmp/ghpages/
          echo "Seed complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packer deps
        run: pip install -q flatbuffers pyyaml pydantic

      - name: Generate docs (static, no AI)
        env:
          TRANSLATE_ENABLED: ${{ env.TRANSLATE_ENABLED }}
          FORCE_REGEN: ${{ github.event.inputs.force_regenerate || 'false' }}
        run: |
          TRANSLATE_FLAG=""
          if [ "$TRANSLATE_ENABLED" = "true" ]; then
            TRANSLATE_FLAG="--translate"
          fi
          # Prefer the usage-aware generator already on gh-pages. The copy on
          # main does not inject 使用方法 cards and would overwrite them.
          if [ -f /tmp/ghpages/scripts/generate_docs.py ]; then
            export PYTHONPATH=/tmp/ghpages/scripts
            GEN=/tmp/ghpages/scripts/generate_docs.py
          else
            GEN=public-repo/scripts/generate_docs.py
          fi
          # --no-ai：CI 不调用 AI（GitHub Models 会返回非 JSON 的 200 OK，
          # 且免费的用量无法支撑 1900+ 文档）。AI 内容统一由后端批量生成。
          python "$GEN" \
            --engine-root engine-repo \
            --docs-root /tmp/ghpages \
            --force     "$FORCE_REGEN" \
            --no-ai \
            $TRANSLATE_FLAG

      - name: Re-inject AI usage cards from gh-pages JSON
        run: |
          set -euo pipefail
          if [ -f /tmp/ghpages/scripts/apply_ai_usage.py ]; then
            PYTHONPATH=/tmp/ghpages/scripts python /tmp/ghpages/scripts/apply_ai_usage.py
          else
            echo "apply_ai_usage.py not on gh-pages yet; skip inject"
          fi

      - name: Pack usage.fb for the Vue catalog
        run: |
          set -euo pipefail
          PYTHONPATH=public-repo python public-repo/scripts/pack_usage_fb.py \
            --docs-root /tmp/ghpages \
            --engine-root engine-repo

      - name: Commit & push gh-pages
        run: |
          set -euo pipefail
          cd /tmp/ghpages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 清掉 gh-pages 上残留的 Actions，避免旧的 Jekyll Deploy 被 push 触发、盖掉 Vue 站。
          rm -rf .github
          git add -A
          if git diff --cached --quiet; then
            echo "No new docs to publish."
            echo "### Docs generation" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing new to publish — every plugin/module was already documented." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ADDED=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
          MODS=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
          git commit -q -m "docs: ${ADDED} new + ${MODS} updated plugin/module intros"
          git push -u origin gh-pages
          echo "### Docs generation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- new files: ${ADDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- updated files: ${MODS}" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy Vue site to GitHub Pages
    needs: generate-docs
    if: success()
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
