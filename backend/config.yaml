# === UE Plugin Docs 后端配置 ===
# 改完后自动热重载（uvicorn --reload），无需重启

# Unreal Engine 源码根目录
engine_root: "/tmp/mock-engine"

# AI 配置：任何 OpenAI-compatible 端点都能填
ai:
  enabled: true
  model: "gpt-4o-mini"
  endpoint: "https://api.openai.com/v1"
  api_key: ""            # 也可走环境变量 UE_AI_API_KEY 覆盖
  timeout: 60            # 秒
  stream_chunk_size: 128

# 扫描策略
scan:
  plugins_dir: "Engine/Plugins"
  source_dir:  "Engine/Source"
  parallel: true

# 静态资源 & 构建产物
site:
  docs_root:  "/tmp/ghpages"   # generate_docs.py 输出目录
  rebuild_on_start: false      # 启动时要不要先跑一次 generator

# CORS：开发时放开，生产收紧
cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:8000"
    - "http://localhost:8080"
